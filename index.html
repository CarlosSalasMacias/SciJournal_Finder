<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <script>
      (function() {
        try {
          var _nativeFetch = window.fetch;
          var _currentFetch = function() {
            return _nativeFetch.apply(window, arguments);
          };
          if (_nativeFetch) {
            for (var key in _nativeFetch) {
              try { _currentFetch[key] = _nativeFetch[key]; } catch (e) {}
            }
          }
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            }
          });
        } catch (e) {}

        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && typeof event.reason.stack === 'string' && event.reason.stack.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <title>SciJournal Finder - revistas Q1-Q3 de bajo costo</title>
    <meta name="description" content="Encuentra revistas Q1-Q3 con APC bajo o nulo y formato libre en el envío inicial." />
    <meta property="og:title" content="SciJournal Finder - revistas Q1-Q3 de bajo costo" />
    <meta property="og:description" content="Encuentra revistas Q1-Q3 con APC bajo o nulo y formato libre en el envío inicial." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
