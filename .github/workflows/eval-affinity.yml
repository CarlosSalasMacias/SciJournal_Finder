name: Evaluar afinidad

# Mide la afinidad temática con el banco eval/queries.json, con y sin IA.
# Requiere el secreto GEMINI_API_KEY para la parte con IA. Se lanza a mano desde la pestaña Actions.
on:
  workflow_dispatch:
    inputs:
      set:
        description: 'Conjunto de búsquedas (dev = ajuste, test = reservado)'
        default: test
        type: choice
        options: [test, dev]
      model:
        description: 'Modelo de Gemini (vacío = gemini-flash-lite-latest)'
        default: ''
        type: string

permissions:
  contents: read

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Modelos de Gemini disponibles
        if: ${{ env.GEMINI_API_KEY != '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -s -m 30 -H "x-goog-api-key: $GEMINI_API_KEY" \
            "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200" \
            | jq -r '[.models[] | select(.supportedGenerationMethods | index("generateContent")) | .name | sub("models/"; "")] | "Modelos disponibles: " + join(", ")' \
            | sed 's/^/::notice::/'
      - name: Evaluar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            npm run eval -- --set ${{ inputs.set }} --ai
          else
            echo "Sin secreto GEMINI_API_KEY: solo se evalúa la detección por vocabulario."
            npm run eval -- --set ${{ inputs.set }}
          fi
